# wrkgrd.toml — generated by `wrkgrd init`.
# Run `wrkgrd rules` to see which stacks would be verified.
# Run `wrkgrd verify` to verify the tree.
#
# Declarative toggles only. These are the SAME toggles the auto-running
# verify-code.sh Stop hook honours, so behaviour stays identical across hook,
# CI, and manual CLI. No value here is ever executed.

# Skip the redundant test step when the build/check step already failed.
skip_tests_if_build_fails = true

# Stacks to skip entirely: "go", "node", "python", "rust", "ruby".
disable = []

# --- Per-tool overlay (ADR-010) — data only, never commands ---
# Disable a single catalogued tool (finer than `disable`, which is per-stack):
# [tools.cargo-machete]
# enabled = false
#
# Override the commit-message Conventional Commits type list (default: the
# standard @commitlint/config-conventional set):
# [tools.commit-message]
# types = ["feat", "fix", "docs", "chore"]

# --- stdlib-only dependency policy (ADR-021) — data only ---
# Warn (never block) on each third-party runtime dependency a stack's manifest
# declares — Cargo.toml [dependencies], go.mod require, package.json dependencies,
# Gemfile runtime gems. Dev/build/test tooling is not flagged. Off by default;
# a single toggle opts every detected stack in. Mute one language with the
# per-tool overlay above, e.g. [tools.stdlib-only-node] enabled = false.
# [stdlib-only]
# enable = true

# --- Link integrity in built site output (ADR-028) — data only ---
# For every page under each output root, require each internal link to resolve to
# a file and each #fragment to a real id. Reads generated HTML, so run it in CI or
# a pre-deploy gate (`wrkgrd verify --links`), not per-turn: a stale build
# directory yields stale findings. Inert until `roots` is set.
# A missing target file is an error; a missing fragment warns by default —
# fragment_severity = "error" promotes it once your fragments are clean.
# An exclude is not optional in practice: most sites build pages they do not ship.
# [link-integrity]
# roots = ["public"]            # or ["sites/*/public"] for a multi-site monorepo
# exclude = ["mockups/**"]
# fragment_severity = "warn"

# --- Native secret scan (ADR-015) — data only ---
# The always-on staged-secret scan (`wrkgrd verify --staged`, the pre-commit hook)
# scans whole-file content. Exempt paths that deliberately hold fake secrets — your
# own scanner fixtures — instead of reaching for `git commit --no-verify`. Matching
# is path-prefix, not glob: an exact path, or a "dir/"-suffixed entry for a subtree.
# [secret-scan]
# allow_paths = ["tests/fixtures/", "src/secrets.rs"]

# --- Future: free-form per-stack command overrides (ADR-001 WRK-003) ---
# Permitted only in this opt-in binary, never in the auto-running hook.
# Not yet implemented; this stub has no effect.
# [commands]
# rust = ["cargo", "clippy", "--", "-D", "warnings"]
