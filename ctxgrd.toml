# ctxgrd.toml — generated by `ctxgrd init`.
#
# ctxgrd — A CLI linter for ADRs, PRDs, runbooks, and the
# structured markdown your team and your AI both depend on.
# Docs: https://ctxgrd.aktagon.com
#
# Each [<NAMESPACE>] section maps a rule list + params to
# documents with ids starting with that namespace.
# Uncomment any of the example blocks below to enable that
# namespace. Customize the headings / allowed values to match
# your team's conventions.

# Files matching any of these globs are skipped by the
# markdown walker — no diagnostics, not listed anywhere.
# Patterns are relative to the lint root; gitignore-style.
[ignore]
patterns = [
  "**/.*",
  "target/**",
  "**/node_modules/**",
  "**/__pycache__/**",
  "**/dist/**",
  "**/build/**",
  "**/log/**",
  "**/logs/**",
  "**/tmp/**",
]

# Roles that may own a namespace. Uncomment to check every
# `owner` value below against this list; leave it commented and
# `owner` is accepted as written.
# [roles]
# allowed = ["developer", "product-strategist", "writer"]

# pack: project-docs@3.0.0 sha:ce6312bfc9f51ee9
[ADR]
owner = "developer"
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.dep-status",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.successor-link",
  "core.acceptance-complete",
  "core.link-resolved",
]
paths = ["docs/adrs/**"]

[ADR."core.required-headings"]
headings = ["Status", "Context", "Requirements", "Consequences", "Open Questions", "References", "Change log"]
# Conventional minimal shape, if you prefer it:
# headings = ["Status", "Context", "Decision", "Consequences"]

[ADR."core.required-metadata"]
keys = ["id", "title", "status", "date"]

[ADR."core.allowed-values"]
status = ["draft", "accepted", "rejected", "superseded"]

# pack: project-docs@3.0.0 sha:85e03e716efcbdc9
[PRD]
owner = "product-strategist"
rules = [
  "core.frontmatter",
  "core.id",
  "core.id-unique",
  "core.dep-resolved",
  "core.dep-cycle",
  "core.dep-status",
  "core.cross-ref",
  "core.required-headings",
  "core.required-metadata",
  "core.allowed-values",
  "core.successor-link",
  "ears.clause-syntax",
  "core.link-resolved",
  # Enable once this namespace has its first document:
  # "core.min-docs",
]
paths = ["docs/prds/**"]

[PRD."core.required-headings"]
headings = ["Context", "Goals", "Non-goals", "User stories", "Requirements", "Definition of Done", "Open Questions", "References", "Change log"]
# Conventional minimal shape, if you prefer it:
# headings = ["Overview", "Goals", "Requirements", "Success metrics"]

[PRD."core.required-metadata"]
keys = ["id", "title", "status"]

[PRD."core.allowed-values"]
status = ["draft", "accepted", "superseded"]

